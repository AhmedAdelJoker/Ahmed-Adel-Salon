name: Electron Signed Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build unpacked application
        working-directory: frontend
        run: npx electron-builder --win --dir
      - name: Create signed update package
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          $workspace = $env:GITHUB_WORKSPACE
          $artifact = Join-Path $workspace "update-$version.zip"
          $appRoot = Join-Path $workspace 'frontend\dist-electron\win-unpacked\resources\app'
          if (-not (Test-Path -LiteralPath $appRoot)) { throw "Application bundle not found: $appRoot" }
          Compress-Archive -Path (Join-Path $appRoot '*') -DestinationPath $artifact -Force
          node frontend/scripts/prepare-update.mjs --artifact $artifact --version $version --output (Join-Path $workspace 'release') --notes "Signed release $version"
      - name: Upload signed update
        uses: actions/upload-artifact@v4
        with:
          name: salonpro-update-${{ inputs.version || github.ref_name }}
          path: |
            release/update-*.zip
            release/version.json
            release/update-public-key.pem
          if-no-files-found: error
          retention-days: 14
