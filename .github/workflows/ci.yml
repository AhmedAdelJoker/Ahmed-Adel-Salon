name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  root-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest -v

      - name: Verify clean-room migrations
        run: |
          cd backend
          rm -f salon_pro.db
          alembic upgrade head
          python -c "from sqlalchemy import create_engine, text; engine=create_engine('sqlite:///salon_pro.db'); connection=engine.connect(); assert connection.execute(text(\"SELECT version_num FROM alembic_version\")).scalar() == 'd6e7f8a9b0c1'; assert not connection.execute(text('PRAGMA foreign_key_check')).fetchall(); connection.close()"

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Audit production dependencies
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      - name: Run lint
        run: |
          cd frontend
          npm run lint

      - name: Run typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run tests
        run: |
          cd frontend
          npm run test:run

      - name: Run build
        run: |
          cd frontend
          npm run build

  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: public-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: public-site

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: public-site

      - name: Lint
        run: npm run lint
        working-directory: public-site

      - name: Typecheck
        run: npm run typecheck
        working-directory: public-site

      - name: Build
        run: npm run build
        working-directory: public-site

      - name: Verify deployment contracts
        run: npm run test:contracts
        working-directory: public-site

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Build with E2E API URL
        run: |
          cd frontend
          VITE_API_URL="http://127.0.0.1:18001/api/v1" npm run build

      - name: Run smoke E2E
        run: |
          cd frontend
          npx playwright test --config=playwright.smoke.config.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [root-dependency-audit, backend-tests, frontend-lint, public-site, e2e-smoke]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build

      - name: Verify images
        run: |
          docker compose config
