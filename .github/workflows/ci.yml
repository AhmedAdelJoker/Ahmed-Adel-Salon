name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  root-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest -v

      - name: Verify clean-room migrations
        run: |
          cd backend
          rm -f salon_pro.db
          alembic upgrade head
          python - <<'PY'
          import subprocess
          from sqlalchemy import create_engine, inspect, text
          from app.db.base import Base
          import app.main  # noqa: F401  — importing registers every model

          # Resolve the head dynamically so adding a migration never breaks CI.
          head = subprocess.run(
              ["alembic", "heads"], capture_output=True, text=True, check=True
          ).stdout.split()[0]

          engine = create_engine("sqlite:///salon_pro.db")
          with engine.connect() as conn:
              stamped = conn.execute(text("SELECT version_num FROM alembic_version")).scalar()
              assert stamped == head, f"stamped {stamped} != head {head}"
              assert not conn.execute(text("PRAGMA foreign_key_check")).fetchall()

          # Every mapped model table/column must actually exist after migrating.
          inspector = inspect(engine)
          db_tables = set(inspector.get_table_names())
          missing = sorted(set(Base.metadata.tables) - db_tables)
          assert not missing, f"tables missing from schema: {missing}"
          for table in Base.metadata.sorted_tables:
              have = {c["name"] for c in inspector.get_columns(table.name)}
              want = {c.name for c in table.columns}
              assert not (want - have), f"{table.name} missing columns: {sorted(want - have)}"
          print(f"clean-room migration OK at {head} ({len(db_tables)} tables)")
          PY

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Audit production dependencies
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      - name: Run lint
        run: |
          cd frontend
          npm run lint

      - name: Run typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run tests
        run: |
          cd frontend
          npm run test:run

      - name: Run build
        run: |
          cd frontend
          npm run build

  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: public-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: public-site

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: public-site

      - name: Lint
        run: npm run lint
        working-directory: public-site

      - name: Typecheck
        run: npm run typecheck
        working-directory: public-site

      - name: Build
        run: npm run build
        working-directory: public-site

      - name: Verify deployment contracts
        run: npm run test:contracts
        working-directory: public-site

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Build with E2E API URL
        run: |
          cd frontend
          VITE_API_URL="http://127.0.0.1:18001/api/v1" npm run build

      - name: Run smoke E2E
        run: |
          cd frontend
          npx playwright test --config=playwright.smoke.config.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  production-boot:
    runs-on: ubuntu-latest
    needs: [root-dependency-audit, backend-tests, frontend-lint, public-site, e2e-smoke]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      # Guards the secrets that used to only be enforced in the (now removed)
      # container image: production must refuse placeholder values and the
      # demo seed must not run outside development.
      - name: Refuse placeholder secrets in production
        env:
          ENVIRONMENT: production
          SECRET_KEY: changeme-in-production
          FIRST_SUPERUSER_PASSWORD: Str0ngPass!2345
        run: |
          cd backend
          if python -c "import app.core.config" 2>/tmp/cfg_err; then
            echo "::error::production accepted a placeholder SECRET_KEY"
            exit 1
          fi
          grep -q "SECRET_KEY" /tmp/cfg_err \
            || { echo "::error::unexpected failure"; cat /tmp/cfg_err; exit 1; }
          echo "placeholder secret correctly rejected"

      - name: Boot the ASGI app on a real port
        env:
          ENVIRONMENT: production
          SEED_DEMO_DATA: "false"
          DATABASE_URL: sqlite:///./salon_pro.db
          FIRST_SUPERUSER_PASSWORD: Str0ngPass!2345
        run: |
          cd backend
          SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          export SECRET_KEY
          alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18001 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18001/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18001/health
          # Production must not expose the interactive docs or the schema.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/openapi.json)
          if [ "$code" != "404" ]; then
            echo "::error::openapi.json exposed in production (HTTP $code)"
            exit 1
          fi
          echo "health OK and docs hidden in production"
