<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Barber Luxe - نظام احترافي لإدارة محلات الحلاقة، المبيعات، الحجوزات، الموظفين، المخزون، والتقارير."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090B" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Salon Pro" />
    <meta name="application-name" content="Salon Pro" />

    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = storedTheme === "dark" || storedTheme === "light" ? storedTheme : prefersDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Fonts are self-hosted via @fontsource/* packages (see src/main.jsx) -->

    <title>Barber Luxe | نظام إدارة الصالونات الاحترافي</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barberluxe.pro/" />
    <meta property="og:title" content="Barber Luxe | نظام إدارة الصالونات" />
    <meta property="og:description" content="إدارة صالونك باحترافية: مبيعات، حجوزات، عملاء، ومخزون في منصة واحدة." />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://barberluxe.pro/" />
    <meta property="twitter:title" content="Barber Luxe | نظام إدارة الصالونات" />
    <meta property="twitter:description" content="إدارة صالونك باحترافية: مبيعات، حجوزات، عملاء، ومخزون في منصة واحدة." />
    <meta property="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
