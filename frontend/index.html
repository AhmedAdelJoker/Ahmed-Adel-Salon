<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-accent="indigo" data-density="comfortable" data-motion="normal" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Barber Luxe - نظام احترافي لإدارة محلات الحلاقة، المبيعات، الحجوزات، الموظفين، المخزون، والتقارير."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Rewritten by the bootstrap below so the mobile browser chrome always
         matches the active theme instead of only following the OS setting. -->
    <meta name="theme-color" content="#fbfbfd" />

    <!--
      Appearance + direction bootstrap.

      Runs before first paint so there is no light-mode flash on a dark
      desktop, and no frame of mirrored Arabic layout for an English user.
      Reads the persisted preferences; anything missing or corrupt falls back
      to the system preference. Kept inline and dependency-free on purpose: it
      must work in the Electron build, where the origin is file:// and no
      external request is guaranteed.

      `data-theme` and the `dark` class are both set because the token layer
      keys off the attribute while Tailwind's `dark:` variants key off the
      class — they must never diverge. `dir`/`lang` are set here for the same
      reason: i18next is a runtime dependency and cannot be consulted in time.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var ACCENTS = ["indigo", "violet", "cyan", "emerald", "gold"];
        var DENSITIES = ["compact", "comfortable", "spacious"];
        var MOTIONS = ["reduced", "normal", "rich"];

        function read(key, allowed, fallback) {
          try {
            var value = localStorage.getItem(key);
            return allowed.indexOf(value) !== -1 ? value : fallback;
          } catch (error) {
            return fallback;
          }
        }

        var storedTheme = read("theme", ["light", "dark"], null);
        var prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = storedTheme || (prefersDark ? "dark" : "light");

        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.dataset.accent = read("accent", ACCENTS, "indigo");
        root.dataset.density = read("density", DENSITIES, "comfortable");
        root.dataset.motion = read("motion", MOTIONS, "normal");

        // Direction has to match the resolved language exactly, including the
        // regional-tag reduction (`en-GB` → `en`), or the layout mirrors wrongly.
        var storedLang = read("language", ["ar", "en"], null);
        var lang = storedLang || (root.getAttribute("lang") === "en" ? "en" : "ar");
        root.setAttribute("lang", lang);
        root.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");

        // High-contrast is an accessibility preference, not a theme: it
        // strengthens every line token without changing the accent.
        try {
          if (localStorage.getItem("highContrast") === "true") {
            root.dataset.contrast = "high";
          }
        } catch (error) {
          /* storage blocked — keep the default */
        }

        // Keep the mobile browser chrome in step with the app canvas.
        var meta = document.querySelector('meta[name="theme-color"]:not([media])');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#08080a" : "#fbfbfd");
        }
      })();
    </script>

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=IBM+Plex+Sans+Arabic:wght@100..700&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <title>Barber Luxe | نظام إدارة الصالونات الاحترافي</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barberluxe.pro/" />
    <meta property="og:title" content="Barber Luxe | نظام إدارة الصالونات" />
    <meta property="og:description" content="إدارة صالونك باحترافية: مبيعات، حجوزات، عملاء، ومخزون في منصة واحدة." />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://barberluxe.pro/" />
    <meta property="twitter:title" content="Barber Luxe | نظام إدارة الصالونات" />
    <meta property="twitter:description" content="إدارة صالونك باحترافية: مبيعات، حجوزات، عملاء، ومخزون في منصة واحدة." />
    <meta property="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
